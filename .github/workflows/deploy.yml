name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run Python tests
        run: python -I -m unittest discover -s tests
      - name: Run JavaScript tests
        run: node --test "tests/js/*.test.mjs"
      - name: Build site
        env:
          REPO_NAME: ${{ github.event.repository.name }}
          MK_FORM_KEY: ${{ vars.MK_FORM_KEY }}
        run: |
          # A repo named <user>.github.io is served from the root. Any other repo is served from /<repo>.
          case "$REPO_NAME" in
            *.github.io) export MK_BASE_PATH="" ;;
            *) export MK_BASE_PATH="/$REPO_NAME" ;;
          esac
          echo "Base path: '$MK_BASE_PATH'"
          python tools/site/build_site.py --out site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
